name: Flutter Web Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 is required: tool/ci_version.sh derives the version from
      # the commit count, which collapses to 1 on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same version as the Android build — see tool/ci_version.sh.
      - name: Compute version
        id: version
        run: bash tool/ci_version.sh

      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run tool/setup_web.dart
      - run: flutter build web --release --base-href /DejaPoo/ --dart-define=APP_VERSION=${{ steps.version.outputs.name }}
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git --work-tree build/web add --all
      - run: git commit -m "Automatic deployment by github-actions"
      - run: git push origin HEAD:gh-pages --force
