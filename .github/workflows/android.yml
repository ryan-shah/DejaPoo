name: Android Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 is required: tool/ci_version.sh derives the version from
      # the commit count, which collapses to 1 on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # versionName = <MAJOR.MINOR from pubspec.yaml>.<commit count>,
      # versionCode = <commit count>. See tool/ci_version.sh.
      - name: Compute version
        id: version
        run: bash tool/ci_version.sh

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # NOTE: the `if:` must read `secrets.` directly. A step's own `env:` block
      # is not visible to that step's `if:` expression, so the previous
      # `env.KEYSTORE_BASE64 != ''` was always false and this step never ran —
      # the real release keystore was never written even with the secrets set.
      - name: Set up release signing
        if: github.event_name == 'push' && secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" \
            > android/key.properties

      # Without this the release build falls back to Gradle's `debug` signing
      # config, which uses a keystore the runner generates per run: a different
      # SHA-1 every build, so Google Sign-In rejects the APK. Sign with a fixed
      # keystore whose fingerprint is registered against the Android OAuth
      # client instead (see designs/GOOGLE_OAUTH_SETUP.md). Deliberately writes
      # key.properties rather than dropping the keystore at ~/.android, which
      # AGP did not pick up on the runner.
      - name: Set up CI test signing
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f android/key.properties ]; then
            echo "Real release keystore configured; leaving it in place."
            exit 0
          fi
          if [ -z "$CI_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::CI_DEBUG_KEYSTORE_BASE64 is not set; the APK will be signed with an ephemeral debug key and cannot use Google Sign-In."
            exit 0
          fi
          echo "$CI_DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/ci-test-keystore.jks
          {
            echo "storePassword=android"
            echo "keyPassword=android"
            echo "keyAlias=androiddebugkey"
            echo "storeFile=ci-test-keystore.jks"
          } > android/key.properties

      # The APK/AAB are renamed to carry the version so a downloaded artifact
      # is self-identifying. APK_PATH/AAB_PATH are exported to $GITHUB_ENV so
      # every later step (verification, uploads, releases) uses one path.
      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION_NAME"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            APK_NAME="dejapoo-pr${PR_NUMBER}-v${VERSION_NAME}.apk"
          else
            APK_NAME="dejapoo-v${VERSION_NAME}.apk"
          fi
          APK_PATH="build/app/outputs/flutter-apk/${APK_NAME}"
          mv build/app/outputs/flutter-apk/app-release.apk "$APK_PATH"
          echo "APK_PATH=${APK_PATH}" >> "$GITHUB_ENV"
          echo "Built $APK_PATH"

      # A wrongly-signed APK still builds and tests green, and only fails later
      # at sign-in on a device. Print the fingerprint so it is checkable here.
      - name: Report APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Build AAB
        if: github.event_name == 'push'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION_NAME"
          AAB_PATH="build/app/outputs/bundle/release/dejapoo-v${VERSION_NAME}.aab"
          mv build/app/outputs/bundle/release/app-release.aab "$AAB_PATH"
          echo "AAB_PATH=${AAB_PATH}" >> "$GITHUB_ENV"
          echo "Built $AAB_PATH"

      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dejapoo-pr-${{ github.event.number }}
          path: ${{ env.APK_PATH }}

      # PR artifacts download as a ZIP and require a GitHub login, which is
      # awkward on a phone. Publish the APK as a prerelease as well so it has
      # a direct, one-tap download link. Skipped for fork PRs, whose
      # read-only token cannot create releases.
      - name: Publish PR prerelease
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: PR #${{ github.event.number }} test build
          prerelease: true
          body: |
            Test build of PR #${{ github.event.number }}, version
            ${{ steps.version.outputs.name }} (build
            ${{ steps.version.outputs.code }}). Not a release, and deleted
            automatically when the PR closes.

            Signed with the CI test keystore, whose fingerprint must be
            registered on the Android OAuth client for Google Sign-In to
            work — see designs/GOOGLE_OAUTH_SETUP.md.

            Commit: ${{ github.event.pull_request.head.sha }}
          files: ${{ env.APK_PATH }}

      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          generate_release_notes: true
          files: |
            ${{ env.APK_PATH }}
            ${{ env.AAB_PATH }}
