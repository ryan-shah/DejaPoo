<!-- Android adaptive-icon foreground layer: mark only, transparent field.
     Drawn to fill its own canvas as the 72dp viewport — mipmap-anydpi-v26/ic_launcher.xml
     insets this by 16%, so the mark lands at ~59% of the 108dp canvas, inside the 61%
     guaranteed-safe circle. (The old generator pre-scaled to 0.62 AND took the inset,
     which is why the mark was tiny.) Also the Android 12+ splash icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <g transform="translate(24 24) scale(1.1) translate(-24 -24)">
    <g fill="#FAFAF7">
    <circle cx="24.000" cy="8.000" r="3.075"/>
    <circle cx="36.509" cy="14.024" r="2.05"/>
    <circle cx="39.599" cy="27.560" r="2.05"/>
    <circle cx="30.942" cy="38.415" r="2.05"/>
    <circle cx="17.058" cy="38.415" r="2.05"/>
    <circle cx="8.401" cy="27.560" r="2.05"/>
    <circle cx="11.491" cy="14.024" r="2.05"/>
    </g>
  <rect x="15" y="20.6" width="18" height="6.8" rx="3.4" ry="3.4" fill="#3E6B48"
        transform="rotate(-25 24 24)"/>
  </g>
</svg>
